<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>undecV's Landing Page</title>
    <meta
      name="description"
      content="Explore undecV's projects, blog articles, and academic work—all from a single landing page."
    />

    <link rel="icon" type="image/x-icon" href="./favicon.ico" />
    <link rel="canonical" href="https://undecv.github.io/" />

    <meta property="og:type" content="website" />
    <meta property="og:title" content="undecV's Landing Page" />
    <meta
      property="og:description"
      content="Explore undecV's projects, blog articles, and academic work—all from a single landing page."
    />
    <meta property="og:url" content="https://undecv.github.io/" />
    <meta
      property="og:image"
      content="https://gravatar.com/avatar/5615c32282d64c2bdd03899c18f710e4ac87f4a2867710f3e93b9345de244c9d?s=256"
    />

    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="undecV's Landing Page" />
    <meta
      name="twitter:description"
      content="Explore undecV's projects, blog articles, and academic work—all from a single landing page."
    />
    <meta
      name="twitter:image"
      content="https://gravatar.com/avatar/5615c32282d64c2bdd03899c18f710e4ac87f4a2867710f3e93b9345de244c9d?s=256"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <link rel="stylesheet" href="./assets/css/links.css" />
  </head>

  <body data-material="acrylic" data-wallpaper-effect="material">
    <picture class="lk-wallpaper-source">
      <source
        media="(prefers-color-scheme: dark) and (min-width: 2560px)"
        srcset="./assets/images/ian-valerio-CAFq0pv9HjY-unsplash.jpg"
      />
      <source
        media="(prefers-color-scheme: dark)"
        type="image/avif"
        srcset="
          ./assets/images/ian-valerio-CAFq0pv9HjY-unsplash.1280.avif 1280w,
          ./assets/images/ian-valerio-CAFq0pv9HjY-unsplash.1920.avif 1920w
        "
        sizes="100vw"
      />
      <source
        media="(prefers-color-scheme: dark)"
        srcset="./assets/images/ian-valerio-CAFq0pv9HjY-unsplash.1280.avif"
      />
      <source
        media="(min-width: 2560px)"
        srcset="./assets/images/jason-briscoe-pAqfQye5hlw-unsplash.jpg"
      />
      <source
        type="image/avif"
        srcset="
          ./assets/images/jason-briscoe-pAqfQye5hlw-unsplash.1280.avif 1280w,
          ./assets/images/jason-briscoe-pAqfQye5hlw-unsplash.1920.avif 1920w
        "
        sizes="100vw"
      />
      <img
        class="lk-wallpaper"
        src="./assets/images/jason-briscoe-pAqfQye5hlw-unsplash.1280.avif"
        width="1920"
        height="1280"
        alt=""
        aria-hidden="true"
        fetchpriority="high"
      />
    </picture>

    <main class="lk-container">
      <section class="lk-section has-no-background" aria-labelledby="profile-name">
        <header class="lk-block-header has-no-background">
          <div class="lk-block-icon">
            <img
              src="./assets/images/gravatar.192.webp"
              width="96"
              height="96"
              alt=""
              class="is-rounded"
            />
          </div>
          <div class="lk-block-content">
            <h1 class="is-rainbow" id="profile-name">undecV</h1>
            <p>Hello there!</p>
          </div>
        </header>
      </section>

      <nav class="lk-section has-no-background" aria-label="Primary links">
        <a
          class="lk-block-link"
          href="https://github.com/undecV"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="lk-block-icon" aria-hidden="true">
            <i class="fa-brands fa-github"></i>
          </span>
          <div class="lk-block-content">
            <h2>GitHub</h2>
            <p>Explore my projects</p>
          </div>
        </a>

        <a
          class="lk-block-link"
          href="https://undecv.github.io/blog/"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="lk-block-icon" aria-hidden="true">
            <i class="fa-solid fa-house"></i>
          </span>
          <div class="lk-block-content">
            <h2>Visit my Blog</h2>
            <p>Read my latest articles</p>
          </div>
        </a>
      </nav>

      <details class="lk-section has-no-background" open>
        <summary>Social Media</summary>

        <a
          class="lk-block-link"
          href="https://g0v.social/@undecv"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="lk-block-icon" aria-hidden="true">
            <i class="fa-brands fa-mastodon"></i>
          </span>
          <div class="lk-block-content">
            <h2>Mastodon</h2>
          </div>
        </a>

        <a
          class="lk-block-link"
          href="https://bsky.app/profile/poi48.xyz"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="lk-block-icon" aria-hidden="true">
            <i class="fa-brands fa-bluesky"></i>
          </span>
          <div class="lk-block-content">
            <h2>Bluesky</h2>
          </div>
        </a>

        <a
          class="lk-block-link"
          href="https://orcid.org/0009-0001-8137-5570"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="lk-block-icon" aria-hidden="true">
            <i class="fa-brands fa-orcid"></i>
          </span>
          <div class="lk-block-content">
            <h2>View my ORCID profile</h2>
            <p>Discover my research</p>
          </div>
        </a>
      </details>

      <section class="lk-section has-no-background">
        <footer class="lk-block-footer">
          <p>
            <small>
              Built with
              <a href="https://github.com/undecV/Links">undecV/Links</a>.
            </small>
          </p>
          <p>
            <small>
              Background photos by
              <a href="https://unsplash.com/photos/CAFq0pv9HjY">Ian Valerio</a>
              and
              <a href="https://unsplash.com/photos/pAqfQye5hlw"
                >Jason Briscoe</a
              >
              on <a href="https://unsplash.com/">Unsplash</a>.
            </small>
          </p>
        </footer>
      </section>
    </main>
  </body>
</html>
